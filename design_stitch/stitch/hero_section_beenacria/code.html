<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Organic Honey Mask Animation */
        @keyframes subtleFlow {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: scale(1) translate(0, 0); }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: scale(1.02) translate(5px, 10px); }
        }
        
        .honey-mask {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: subtleFlow 20s ease-in-out infinite;
            overflow: hidden;
            position: relative;
        }

        .honey-mask::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle at center, rgba(255, 180, 0, 0.1) 0%, transparent 70%);
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
        }
        
        .floating-glow {
            filter: drop-shadow(0 20px 40px rgba(255, 180, 0, 0.15));
        }
    </style>
